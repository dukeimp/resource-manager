<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>稀有金属投资咨询平台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a2b4c'/%3E%3Cpath d='M16 6l7 6-7 14-7-14z' fill='%23d4a72c' stroke='%23f3d987' stroke-width='1.2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/app.css?v=20261116d" />
</head>
<body>
    <!-- 登录 / 注册 -->
    <div id="auth-view" class="auth-view">
        <div class="auth-card">
            <div class="auth-logo"><i class="fa-solid fa-gem"></i></div>
            <h1 id="auth-title">稀有金属投资咨询平台</h1>
            <p class="auth-sub" id="auth-sub">登录以查看稀有 / 贵金属行情、产业链资讯与投资研究</p>

            <form id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="账号" autocomplete="username" />
                <input type="password" id="login-password" placeholder="密码" autocomplete="current-password" />
                <button type="submit" class="btn btn-primary btn-block">登录</button>
            </form>
        </div>
    </div>

    <!-- 主应用 -->
    <div id="app-view" class="app-view" style="display:none">
        <aside class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-gem"></i><span id="brand-name">稀有金属投资咨询平台</span></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
        </aside>
        <main class="main">
            <header class="topbar">
                <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
                <h2 id="view-title">实时行情</h2>
                <div class="topbar-right">
                    <button class="btn btn-ghost bell-btn" id="bell-btn" title="通知中心"><i class="fa-solid fa-bell"></i><span class="bell-badge" id="bell-badge" style="display:none">0</span></button>
                    <div class="user-menu" id="user-menu">
                        <button class="avatar-btn" id="avatar-btn" title="账号菜单" aria-haspopup="true" aria-expanded="false">
                            <span class="avatar" id="avatar-initial">A</span>
                        </button>
                        <div class="user-dropdown" id="user-dropdown" hidden>
                            <div class="ud-head">
                                <span class="avatar avatar-lg" id="avatar-initial-lg">A</span>
                                <div class="ud-meta"><b id="ud-name">—</b><small id="ud-role">—</small></div>
                            </div>
                            <button class="ud-item" id="change-pwd-btn"><i class="fa-solid fa-key"></i> 修改密码</button>
                            <button class="ud-item ud-danger" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="view-container" id="view-container"></section>
        </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="/js/vendor/echarts.min.js"></script>
    <script src="/js/app.js?v=20261117b"></script>
</body>
</html>
